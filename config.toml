# =============================================================================
# LinkedIn Alert — edite este arquivo para mudar filtros, WhatsApp e o cron.
# Depois de mudar [schedule], rode:  python -m linkedin_alert.cron --print
# (ou --install para gravar no crontab do usuário)
# =============================================================================

[filters]
# Palavra-chave da busca no LinkedIn
keywords = "laravel"

# País (rótulo na mensagem do WhatsApp)
country = "Brasil"
# ID geográfico do LinkedIn (Brasil = 106057199)
geo_id = "106057199"

# Modalidade: remote | hybrid | onsite | any
# remote → f_WT=2; any → não envia f_WT
workplace = "any"

# Recência: 30m | 1h | 12h | 24h | week
# 30m → f_TPR=r1800 | 1h → f_TPR=r3600 | 12h → f_TPR=r43200 | 24h → f_TPR=r86400 | week → f_TPR=r604800
recency = "30m"
# URL completa usada no filtro:
# https://www.linkedin.com/jobs/search-results/?currentJobId=4468921714&keywords=laravel&origin=SEMANTIC_SEARCH_JOB_ALERT_IN_APP_NOTIFICATION&originToLandingJobPostings=4468921714%2C4470662296%2C4468939639&geoId=106057199&f_TPR=r1800

# Salário: token do f_SAL, ou vazio para não filtrar.
# Ignorado quando search_url está preenchida.
# f_SA_id_225001:272001 → f_SAL=f_SA_id_225001:272001
salary = ""

# URL exata da busca. Scraper e WhatsApp usam este valor, sem remontar a query.
# f_TPR=r1800 → últimos 30 minutos
search_url = "https://www.linkedin.com/jobs/search-results/?currentJobId=4468921714&keywords=laravel&origin=SEMANTIC_SEARCH_JOB_ALERT_IN_APP_NOTIFICATION&originToLandingJobPostings=4468921714%2C4470662296%2C4468939639&geoId=106057199&f_TPR=r1800"

[whatsapp]
# Número com DDI, só dígitos (Brasil 55 + DDD + número)
phone = "555189030405"
# A API key NÃO fica aqui — coloque em .env: CALLMEBOT_APIKEY=...

[schedule]
# Expressão cron: minuto hora dia mês dia-da-semana
# "*/30 * * * *" = a cada 30 minutos
cron = "*/30 * * * *"
# Texto livre, só para o README / --print
description = "A cada 30 minutos"
# Fuso usado na linha do crontab (o f_TPR do LinkedIn é relativo a "agora")
timezone = "America/Sao_Paulo"

[paths]
database = "data/jobs.db"
storage_state = "storage_state.json"
log = "data/cron.log"
lock = "data/linkedin_alert.lock"

[alerts]
# Avisar no WhatsApp se a sessão do LinkedIn expirar
notify_on_session_expired = true
